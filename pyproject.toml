[project]
name = "sure"
version = "0.1.0"
description = "SURE - Structured Quiz Generator & LTI Integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "canvasapi>=3.3.0",
    "fastapi>=0.137.1",
    "google-genai>=1.0.0",
    "itsdangerous>=2.2.0",
    "openai>=2.43.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "pylti1p3>=2.0.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "tiktoken>=0.7",
    "langchain-text-splitters>=0.3",
]
ocr = [
    "docling>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
